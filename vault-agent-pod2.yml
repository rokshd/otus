apiVersion: v1
kind: Pod
metadata:
  name: vault-agent-app2
  namespace: default
  labels:
    app: vault-agent-app2
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "myapp-role"
    
    vault.hashicorp.com/agent-inject-secret-database: "secret/data/myapp/database"
    vault.hashicorp.com/agent-inject-template-database: |
      {{ with secret "secret/data/myapp/database" -}}
      export DB_HOST="{{ .Data.data.host }}"
      export DB_PORT="{{ .Data.data.port }}"
      export DB_USERNAME="{{ .Data.data.username }}"
      export DB_PASSWORD="{{ .Data.data.password }}"
      export DB_NAME="{{ .Data.data.dbname }}"
      {{- end }}
    
    vault.hashicorp.com/agent-inject-secret-api: "secret/data/myapp/api"
    vault.hashicorp.com/agent-inject-template-api: |
      {{ with secret "secret/data/myapp/api" -}}
      export API_KEY="{{ .Data.data.api_key }}"
      export API_URL="{{ .Data.data.api_url }}"
      export API_TIMEOUT="{{ .Data.data.timeout }}"
      {{- end }}
    
    vault.hashicorp.com/agent-cache-enable: "true"
    vault.hashicorp.com/agent-cache-ttl: "30s"

spec:
  serviceAccountName: vault-app-sa
  containers:
  - name: app
    image: alpine:latest
    command: ["sleep", "infinity"]